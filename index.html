<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <title>Tuner</title>
  </head>
  <body>
    <main id="app">
      <header class="bar">
        <label class="field">
          <span>Instrument</span>
          <select id="instrument"></select>
        </label>
        <label class="field">
          <span>A4</span>
          <input id="a4" type="number" inputmode="numeric" min="415" max="466" step="1" />
        </label>
        <label class="field switch">
          <span>Smart filter</span>
          <input id="filter" type="checkbox" role="switch" />
        </label>
      </header>

      <section class="display" id="display" data-state="idle">
        <div class="note" id="note">–</div>
        <div class="meter" aria-hidden="true">
          <div class="scale">
            <span>−50</span><span>−25</span><span>0</span><span>+25</span><span>+50</span>
          </div>
          <div class="track">
            <div class="zone"></div>
            <div class="needle" id="needle"></div>
          </div>
        </div>
        <div class="readout">
          <span id="cents">&nbsp;</span>
          <span id="hertz">&nbsp;</span>
        </div>
        <div class="mode" id="mode" data-mode="idle">
          <span class="dot"></span>
          <span id="mode-text">Tap start and pluck a string</span>
        </div>
      </section>

      <nav class="strings" id="strings" aria-label="Strings"></nav>

      <button class="start" id="start" type="button">Start tuner</button>
      <p class="hint" id="hint"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
