name: Release

# Pushing a tag like v1.0.0-beta builds the app, checks it and publishes it as a GitHub release
# with the APK attached. A tag with a hyphen in it (v1.0.0-beta, v1.1.0-rc1) becomes a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg (decodes the recordings)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The rule of this repository: nothing is handed out that has not been run against the
      # recordings of a real instrument. First, because the app's own tests use them once decoded.
      - name: Engine against the recordings
        run: ./gradlew :engine:recordingsTest

      - name: Tests and lint
        run: ./gradlew test :app:lintDebug

      - name: Check that the tag is the version in the build file
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.TUNER_KEYSTORE_BASE64 }}
          TUNER_KEYSTORE_PASSWORD: ${{ secrets.TUNER_KEYSTORE_PASSWORD }}
          TUNER_KEY_ALIAS: ${{ secrets.TUNER_KEY_ALIAS }}
          TUNER_KEY_PASSWORD: ${{ secrets.TUNER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export TUNER_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "SIGNED_WITH=the project's release key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=a one-off debug key" >> "$GITHUB_ENV"
          fi
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "tuner-$VERSION.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          title="$(echo "$GITHUB_REF_NAME" | sed 's/-/ /')"
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          if [ -f "$notes" ]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "tuner-$VERSION.apk" --title "$title" --verify-tag "${flags[@]}"
          echo "Published $title, signed with $SIGNED_WITH." >> "$GITHUB_STEP_SUMMARY"
