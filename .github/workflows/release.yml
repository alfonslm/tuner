name: Release

# Builds the app, checks it and publishes it as a GitHub release with the APK attached.
#
#  - "Run workflow" on the Actions page (or pushing a tag like v1.0.0-beta) makes the release.
#    The version is the versionName in app/build.gradle.kts; the tag is "v" plus that, and is
#    created here if it does not exist yet. A version with a hyphen (1.0.0-beta, 1.1.0-rc1)
#    becomes a pre-release.
#  - On a pull request everything runs except the publishing, and the APK is kept as an
#    artifact of the run: a rehearsal, and a build of the proposed change to try.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg (decodes the recordings)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Work out the version and the tag
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # The rule of this repository: nothing is handed out that has not been run against the
      # recordings of a real instrument. First, because the app's own tests use them once decoded.
      - name: Engine against the recordings
        run: ./gradlew :engine:recordingsTest

      - name: Tests and lint
        run: ./gradlew test :app:lintDebug

      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.TUNER_KEYSTORE_BASE64 }}
          TUNER_KEYSTORE_PASSWORD: ${{ secrets.TUNER_KEYSTORE_PASSWORD }}
          TUNER_KEY_ALIAS: ${{ secrets.TUNER_KEY_ALIAS }}
          TUNER_KEY_PASSWORD: ${{ secrets.TUNER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export TUNER_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "SIGNED_WITH=the project's release key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=a one-off debug key" >> "$GITHUB_ENV"
          fi
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "tuner-$VERSION.apk"
          echo "Built tuner-$VERSION.apk, signed with $SIGNED_WITH." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: tuner-${{ env.VERSION }}
          path: tuner-${{ env.VERSION }}.apk

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG has already been released; raise versionName in app/build.gradle.kts first"
            exit 1
          fi
          notes="docs/releases/$TAG.md"
          title="$(echo "$TAG" | sed 's/-/ /')"
          flags=(--target "$GITHUB_SHA")
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if [ -f "$notes" ]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
          gh release create "$TAG" "tuner-$VERSION.apk" --title "$title" "${flags[@]}"
          echo "Published $title." >> "$GITHUB_STEP_SUMMARY"
